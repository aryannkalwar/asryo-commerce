name: Prepare Shadowbound gallery assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-shadowbound-gallery.py'
      - '.github/workflows/generate-shadowbound-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install 'Pillow==11.3.0'
      - name: Split the existing mockup into six product images
        run: python scripts/generate-shadowbound-gallery.py
      - name: Publish gallery images to the repository
        run: |
          git add public/assets/shadowbound-*.webp
          if git diff --cached --quiet; then
            echo 'Images unchanged; no commit needed'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add six separate ASRYO Shadowbound gallery views'
            git push origin HEAD:main
          fi
