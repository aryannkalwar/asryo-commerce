name: ASRYO safe validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NODE_ENV: test
      STORE_READY: "false"
      HIDE_PUBLIC_PRODUCTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Install pinned runtime dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Verify runtime
        run: node --version
      - name: Run complete ASRYO validation suite (isolated test data)
        run: npm run check
