        <a href="#collection" class="world-card" data-category-link="clothing"><img loading="lazy" src="/assets/6712e03dc0a4e0b8.jpg" alt="Embroidered ethnic clothing"><div class="world-card-copy"><small>01 / The wardrobe</small><h3>Clothing</h3><span class="world-link">Explore the edit ↗</span></div></a>

    </section>
    <section class="story" id="story"><div class="story-image"><img src="/assets/a6da0fa4a9da02ad.jpg" alt="Radha Krishna jhumka earrings from the ASRYO launch preview"></div><div class="story-copy"><p class="kicker">THE ASRYO EDIT</p><h2>Four worlds.<br><i>One point of view.</i></h2><p>Explore expressive clothing, jewellery with character, art for your walls and considered details for your home. The first ASRYO collection brings them together in one place.</p><a class="text-link" href="#collection">Explore the first edit <span>↗</span></a></div></section>

    <section class="service-section" id="service"><p class="kicker">THE ASRYO EXPERIENCE</p><h2>It is all in <i>the details.</i></h2><div class="service-grid"><article><span>01</span><h3>Find your edit</h3><p>Browse the first ASRYO collection across four distinct worlds.</p></article><article><span>02</span><h3>Ask for a little help</h3><p>Our shopping assistant can guide you through the collection and its confirmed details.</p></article><article><span>03</span><h3>Stay in the know</h3><p>Order tracking and customer accounts will be available when ordering opens.</p></article></div></section>

  <footer class="footer"><a class="brand" href="/">ASRYO<span>THE ART OF EVERYDAY STYLE</span></a><div><p>Follow the first chapter of ASRYO.</p><button class="text-link account-open" type="button">Your account <span>↗</span></button><br><a class="text-link" href="/track.html">Track an order <span>↗</span></a></div><div><p id="supportLine">Support contact, delivery details and return terms will be published before orders open.</p><a class="text-link" href="/policies.html">Policies & service <span>↗</span></a></div><small>© <span id="year"></span> ASRYO. All rights reserved.</small></footer>
  <button class="assistant-launch" id="assistantOpen" type="button"><span>✳</span> Ask ASRYO</button>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer" id="cartDrawer" aria-labelledby="cartTitle" aria-modal="true" role="dialog" hidden><div class="drawer-head"><div><p class="kicker">YOUR SELECTION</p><h2 id="cartTitle">Shopping bag</h2></div><button class="close-button" data-close aria-label="Close bag">×</button></div><div id="cartItems" class="drawer-content"></div><div class="drawer-foot"><div class="subtotal-row"><span>Subtotal</span><strong id="subtotal">₹0</strong></div><p class="muted small" id="cartStatus">Ordering is not open yet. Prices and availability are being confirmed.</p><button class="button button-dark full" id="checkoutOpen" type="button" disabled>Continue to details <span>↗</span></button></div></aside>
  <aside class="drawer" id="assistantDrawer" aria-labelledby="assistantTitle" aria-modal="true" role="dialog" hidden><div class="drawer-head"><div><p class="kicker">ASRYO CONCIERGE</p><h2 id="assistantTitle">A little guidance.</h2></div><button class="close-button" data-close aria-label="Close assistant">×</button></div><div class="assistant-intro"><p>Tell me what you are looking for. I can answer from confirmed collection details and will say when something is still being confirmed.</p><p class="small muted" id="aiDisclosure">Your message stays on this site while the assistant is in preview mode.</p></div><div class="assistant-messages" id="assistantMessages" aria-live="polite"><div class="assistant-bubble">Hello. Are you exploring clothing, jewellery, art or home?</div></div><form id="assistantForm" class="assistant-form"><label class="sr-only" for="assistantQuestion">Ask ASRYO</label><input id="assistantQuestion" maxlength="700" placeholder="Ask about the collection…" required><button class="button button-dark" type="submit" aria-label="Send question">Send</button></form></aside>
  <dialog class="modal" id="accountDialog"><form method="dialog" class="modal-head"><div><p class="kicker">YOUR ASRYO ACCOUNT</p><h2>Welcome back.</h2></div><button class="close-button" aria-label="Close account">×</button></form><div id="accountContent"></div></dialog>
  <dialog class="modal" id="checkoutDialog"><form method="dialog" class="modal-head"><div><p class="kicker">CASH ON DELIVERY</p><h2>Your details.</h2></div><button class="close-button" aria-label="Close checkout">×</button></form><div class="checkout-unavailable" id="checkoutUnavailable"><p>Ordering is not open yet. Product prices, availability, shipping and business details are being confirmed.</p></div><form id="checkoutForm" class="checkout-form" hidden><div class="form-grid"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Phone<input name="phone" type="tel" autocomplete="tel" required></label><label class="span-2">Full name<input name="name" autocomplete="name" required></label><label class="span-2">Address line<input name="line1" autocomplete="address-line1" required></label><label>City<input name="city" autocomplete="address-level2" required></label><label>State / region<input name="region" autocomplete="address-level1" required></label><label>PIN code<input name="postalCode" autocomplete="postal-code" inputmode="numeric" required></label><label>Country<input name="country" value="India" autocomplete="country-name" required></label></div><p class="small muted">Cash on delivery only. Pay the order total in cash when your delivery arrives. No online payment is collected.</p><button class="button button-dark full" type="submit">Place cash on delivery order <span>↗</span></button><p class="form-message" id="checkoutMessage" role="status"></p></form></dialog>
  <dialog class="modal" id="trackingDialog"><form method="dialog" class="modal-head"><div><p class="kicker">YOUR ORDER</p><h2>Track a delivery.</h2></div><button class="close-button" aria-label="Close tracking">×</button></form><form id="trackingForm" class="tracking-form"><label>Order number<input name="id" required></label><label>Private tracking code<input name="token" required></label><button class="button button-dark full" type="submit">Find my order <span>↗</span></button></form><div id="trackingResult" class="tracking-result" aria-live="polite"></div></dialog>
  <dialog class="modal product-modal" id="productDialog"><button class="close-button modal-close" data-close aria-label="Close product details">×</button><div id="productDetail"></div></dialog>
