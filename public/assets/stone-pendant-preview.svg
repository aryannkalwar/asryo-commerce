<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Stone Pendant preview illustration</title>
  <desc id="desc">An original abstract illustration of a pendant on a warm ivory background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f4eee4"/>
      <stop offset="1" stop-color="#e8ddce"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8f6d36"/>
      <stop offset=".32" stop-color="#d2b06b"/>
      <stop offset=".62" stop-color="#f0dba2"/>
      <stop offset="1" stop-color="#9a7338"/>
    </linearGradient>
    <radialGradient id="stone" cx="34%" cy="27%" r="78%">
      <stop stop-color="#dce1cf"/>
      <stop offset=".52" stop-color="#9aab92"/>
      <stop offset="1" stop-color="#4a5b4c"/>
    </radialGradient>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#57432d" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="600" cy="725" r="410" fill="#f8f4ed" opacity=".48"/>
  <path d="M452 240c0 218 31 333 148 468 117-135 148-250 148-468" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <path d="M570 706c0-37 13-58 30-78 17 20 30 41 30 78" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <g filter="url(#shadow)">
    <path d="M600 657 755 835 600 1068 445 835Z" fill="url(#gold)"/>
    <path d="M600 685 725 835 600 1030 475 835Z" fill="url(#stone)" stroke="#f0dda9" stroke-width="8"/>
    <path d="m600 685 39 150-39 195-39-195Z" fill="#e9eddd" opacity=".24"/>
    <path d="m475 835 125 16 125-16" fill="none" stroke="#efe0b8" stroke-opacity=".72" stroke-width="6"/>
  </g>
  <text x="600" y="1270" fill="#50463b" font-family="Georgia,serif" font-size="34" letter-spacing="7" text-anchor="middle">STONE PENDANT</text>
  <text x="600" y="1330" fill="#887b69" font-family="Arial,sans-serif" font-size="18" letter-spacing="5" text-anchor="middle">LAUNCH PREVIEW</text>
</svg>
